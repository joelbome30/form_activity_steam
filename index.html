<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Web</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CORRECCIÓN DE LAS URLS DE GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- formulario -->
    <section id="contacto">
        <h2>Formulario Steam</h2>
        <form id="form">
            <div>
                <p>Nombre</p>
                <input id="nombre" type="text" required class="form">
            </div>
            <div>
                <p>Correo</p>
                <input id="correo" type="email" required class="form">
            </div>
            <div>
                <p>Contacto</p>
                <input id="contacto-telefono" type="text" required class="form">
            </div>
            <div>
                <p>Curso</p>
                <select name="Curso" id="sixseven" required class="form">
                    <option value="robotica">Robotica Maker</option>
                    <option value="dev360">Developer 360</option>
                    <option value="dev360-junior">Developer 360 Junior</option>
                    <option value="hdc">Heroes del Codigo</option>
                </select>
            </div>
            <div>
                <p>Mensaje</p>
                <textarea id="mensaje" required class="form"></textarea>
            </div>
            <div>
                <br>
                <button id="btn" type="submit" class="form">Enviar!</button>
                <br>
                <br>
            </div>
        </form>
        <div id="resumen" hidden aria-live="polite">
            <h2>Tu consulta está lista</h2>
            <p><strong>Nombre:</strong> <span id="resumen-nombre"></span></p>
            <p><strong>Correo:</strong> <span id="resumen-correo"></span></p>
            <p><strong>Contacto:</strong> <span id="resumen-contacto"></span></p>
            <p><strong>Curso:</strong> <span id="resumen-curso"></span></p>
            <p><strong>Mensaje:</strong> <span id="resumen-mensaje"></span></p>
            <p class="aviso-resumen">Esto es una vista previa; los datos no se han enviado.</p>
            <button id="editar" type="button">← Atrás</button>
        </div>
    </section>
    
    <!-- script -->
    <script src="script.js"></script>
</body>
</html>
